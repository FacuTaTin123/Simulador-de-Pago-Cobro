{% extends "base.html" %}{% block title %}Editar producto{% endblock %}{% block body %}<section class="simple-page"><h1>Editar {{ product.name }}</h1><form method="post" class="app-form">{{ form.hidden_tag() }}{% for field in form if field.name not in ['csrf_token', 'submit'] %}<label>{{ field.label }}{{ field() }}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_='primary-link') }}</form></section>{% endblock %}
